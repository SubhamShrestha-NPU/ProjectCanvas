<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button</title>
    <link rel="icon" href="images/proIMGbg.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <button id="buttonP" onclick="Add()">+</button>
    <span id="display"></span>
    <button id="buttonM" onclick="Deduct()">-</button>
    </div>
    <script>
        let x = 0;
        document.getElementById("display").innerHTML = x;
        function Add(){
            document.getElementById("display").innerHTML = x+= 1; //x = x+1
        }
        function Deduct(){
            document.getElementById("display").innerHTML = x-= 1; //x = x-1
        }
    </script>
</body>
</html>
