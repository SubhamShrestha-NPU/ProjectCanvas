<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --box-size: 100px;
        }

        .box {
            width: var(--box-size);
            height: var(--box-size);
            background-color: teal;
            transition: width 0.5s ease, height 0.5s ease;
        }
    </style>
</head>
<body>

<div class="box"></div>
<button onclick="calculateAndSetBoxSize()">Resize Box</button>

<script>
    function calculateAndSetBoxSize() {
        // Perform some calculations in JavaScript
        const randomSize = Math.floor(Math.random() * 200) + 100;  // Random size between 100px and 300px
        
        // Get the root element (i.e., <html> element)
        const root = document.documentElement;

        // Set the calculated size as a new CSS variable value
        root.style.setProperty('--box-size', randomSize + 'px');

        console.log('New box size set to:', randomSize + 'px');
    }
</script>

</body>
</html>
