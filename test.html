<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useful Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .content {
            padding: 20px;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Useful Webpage</h1>
        </div>
        <div class="content">
            <h2>Welcome to our webpage!</h2>
            <p>This webpage is designed to be useful and informative.</p>
            <button id="myButton">Click me!</button>
            <div id="myDiv"></div>
        </div>
        <div class="footer">
            &copy; 2023 Useful Webpage
        </div>
    </div>
    <script>
        document.getElementById("myButton").addEventListener("click", function() {
            document.getElementById("myDiv").innerHTML = "You clicked the button!";
        });
    </script>
</body>
</html>
