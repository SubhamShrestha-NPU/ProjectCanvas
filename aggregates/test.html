<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
             text-align: center;
        }
        body {
            background: linear-gradient(45deg, #802121 20%, #d53737) no-repeat;
            height: 100vh;
            width: 100vw;
            color: #dacbb7;
            line-height: 30px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #container {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px 0 #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        input {
            background: #e3dddd21;
            color:#f0c0c0;
            border: 0;
            border-radius: 10px;
            margin: 10px;
            padding: 3px;
        }

        input:focus,
        input:hover,
        input:active {
            border: 0;
            outline: none;
        }

        #error {
            background: #f8e895;
            color: red;
            font-size: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px 0 #000;
            margin: 10px;
            visibility: hidden;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <div id="container">
        Toady is <span id="day"></span> <br />
        After <input id="num" oninput="checker()"></input> days, it will be <span id="result"></span>
    </div>
    <div id="error"></div>
    <script>
        "use strict";
        const day = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const t = new Date().getDay(); //get current day
        const result = document.getElementById('result');
        const error = document.getElementById('error');

        function checker() {
            const value = document.getElementById('num').value;
            if (value === "") {
                result.innerHTML = "";
                error.style.visibility = "visible";
                error.innerHTML = "Input cannot be empty";
            } else if (isNaN(value)) {
                error.style.visibility = "visible";
                error.innerHTML = "Input must be a number";
            } else if (value < 0) {
                error.style.visibility = "visible";
                error.innerHTML = "Input should be positive"
            }
            else {
                error.innerHTML = "";
                try {
                    const d = (Math.round(value) % 7 + t) % 7;
                    const d2 = day[d];
                    result.textContent = d2;
                    error.style.visibility = 'hidden';
                }
                catch (err) {
                    error.style.visibility = "visible";
                    error.innerHTML = "Error: " + err.message;
                }
            }
        }

        document.getElementById('day').textContent = day[t]; // displays current day


    </script>
</body>

</html>
