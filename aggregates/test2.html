<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Modernized Mascot</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			background: linear-gradient(135deg, #e0f7fa, #80deea);
		}
	</style>
</head>

<body>
	<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
		<!-- Head -->
		<defs>
			<radialGradient id="headGradient" cx="50%" cy="50%" r="50%">
				<stop offset="0%" stop-color="#ffc107" />
				<stop offset="100%" stop-color="#ff8f00" />
			</radialGradient>
			<radialGradient id="shadowGradient" cx="50%" cy="50%" r="70%">
				<stop offset="0%" stop-color="#ffca28" />
				<stop offset="100%" stop-color="#ff6f00" />
			</radialGradient>
		</defs>
		<circle cx="50" cy="50" r="30" fill="url(#headGradient)" />
		<ellipse cx="50" cy="58" rx="25" ry="10" fill="url(#shadowGradient)" opacity="0.4" />

		<!-- Eyes -->
		<circle cx="40" cy="45" r="5" fill="#ffffff" />
		<circle cx="60" cy="45" r="5" fill="#ffffff" />
		<circle cx="40" cy="45" r="2" fill="#000000" />
		<circle cx="60" cy="45" r="2" fill="#000000" />

		<!-- Smile -->
		<path d="M40 55 Q50 65, 60 55" stroke="#000000" fill="none" stroke-width="2" />
	</svg>
</body>

</html>
