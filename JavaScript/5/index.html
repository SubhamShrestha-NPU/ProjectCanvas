<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <!-- https://picsum.photos/200/300 -->
    <!-- https://api.dicebear.com/10.x/patchwork/svg?seed=1dej -->

    <header>
        <nav>
            <a href="#">Moments</a>

            <div>
                <a href="#" class="material-icons">add</a>
                <a href="#" class="material-icons">menu</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- card -->
        <div id="card">
            <!-- main image -->
             <img src="https://picsum.photos/600" alt="main image">

            <!-- card footer -->
            <div id="card_footer">
                <!-- profile -->
                <div id="profile">
                    <img src="https://api.dicebear.com/10.x/patchwork/svg?seed=1dej" alt="profile picture" id="profile_pic">
                    <div>
                        <p id="username">Jon Doe</p>
                        <p id="date">24 Mar, 2023</p>
                    </div>
                </div>
                <!-- actions -->
                 <div id="actions">
                    <button class="material-icons" id="like">favorite_outline</button>
                    <button class="material-icons" id="comments">chat_bubble_outline</button>
                    <button class="material-icons" id="bookmark">bookmark_border</button>
                 </div>
            </div>
        </div>
    </main>

    <footer>
        <div>
            <h1>Moments App</h1>
            <p>Share your moments with the world</p>
        </div>

        <p>&copy; 2026, All Rights Reserved</p>
    </footer>
</body>
</html>
